<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비동기 FEniCSx 솔버</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .custom-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .config-bar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .config-bar input { flex-grow: 1; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: white; }
        #python-editor { width: 100%; height: 500px; font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; border: 1px solid #444; }
        .output-box { background: #2d2d2d; padding: 15px; border: 1px solid #444; min-height: 100px; white-space: pre-wrap; border-radius: 5px; font-family: monospace; color: #fff; margin-top: 10px; max-height: 400px; overflow-y: auto;}
        .error-box { color: #ff6b6b; border-color: #ff6b6b; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #228be6; color: white; }
        .btn-danger { background: #fa5252; color: white; }
        .btn-success { background: #12b886; color: white; }
        .badge { padding: 5px 10px; border-radius: 12px; font-weight: bold; font-size: 0.9em; margin-left: 10px; }
        .bg-gray { background: #868e96; color: white; }
        .bg-blue { background: #228be6; color: white; }
        .bg-yellow { background: #fcc419; color: black; }
        .bg-green { background: #12b886; color: white; }
    </style>
</head>
<body>
    <div class="custom-container">
        <h2>🐍 비동기 FEniCSx 솔버</h2>
        
        <div class="config-bar">
            <label style="color: #69db7c;">실행 ID:</label>
            <input type="text" id="exec-id-input" placeholder="비워두면 새 실행, 기존 ID 입력 시 상태 조회">
            <button id="load-id-btn" class="btn btn-primary" style="padding: 8px 15px; width: 80px; flex-shrink: 0;">조회</button>
            <span id="status-badge" class="badge bg-gray">ANONYMOUS</span>
        </div>

        <div class="config-bar">
            <label style="color: #fbbf24;">명령줄 인자(CLI):</label>
            <input type="text" id="cli-args" placeholder="인자 입력">
        </div>

        <textarea id="python-editor" spellcheck="false" placeholder="# 여기에 코드를 입력하세요."></textarea>
        
        <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center;">
            <button id="run-btn" class="btn btn-primary">▶️ 계산 실행</button>
            <button id="stop-btn" class="btn btn-danger" disabled>🛑 실행 중지</button>
            <button id="save-btn" class="btn btn-success" disabled>📦 결과 저장 (저장 시 서버에서 삭제)</button>
        </div>

        <h3 style="margin-top: 30px;">출력 로그 (Stdout)</h3>
        <pre id="stdout-box" class="output-box"></pre>

        <h3>에러 및 경고 (Stderr)</h3>
        <pre id="stderr-box" class="output-box error-box"></pre>
    </div>

    <script>const API_URL = 'https://uzaramen108-fenics-backend.hf.space';</script>
    <script src="custom.js"></script>
</body>
<footer>
    <p>
        깃헙 코드는 다음에서 보실 수 있습니다:
        <a
        href="https://github.com/uzaramen108/fenics-pde-solver"
        target="_blank"
        >
        GitHub Repository
        </a>
    </p>
    <p class="copyright">
        &copy; 2026 fenics-pde-solver. All rights reserved.
    </p>
</footer>
</html>
