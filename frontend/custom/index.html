<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직접 실행 - FEniCSx Solver</title>
    <link rel="stylesheet" href="../style.css"> <style>
        .custom-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .config-bar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .config-bar input { flex-grow: 1; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: white; }
        #python-editor { width: 100%; height: 500px; font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; border: 1px solid #444; resize: vertical; }
        .output-box { background: #2d2d2d; padding: 15px; border: 1px solid #444; min-height: 100px; white-space: pre-wrap; border-radius: 5px; font-family: monospace; color: #fff; margin-top: 10px; }
        .error-box { color: #ff6b6b; border-color: #ff6b6b; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #228be6; color: white; }
        .btn-success { background: #12b886; color: white; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="custom-container">
        <h2>🐍 파이썬 코드 직접 실행 (FEniCSx)</h2>
        
        <div class="config-bar">
            <label>백엔드 API 주소:</label>
            <input type="text" id="api-url" value="http://localhost:7860" placeholder="예: http://localhost:7860 또는 https://내스페이스.hf.space">
        </div>

        <textarea id="python-editor" spellcheck="false" placeholder="# 여기에 FEniCSx 코드를 입력하세요.&#10;# 결과 파일은 Path('results') 에 저장되도록 작성해야 다운로드 가능합니다."></textarea>
        
        <div style="margin-top: 15px;">
            <button id="run-btn" class="btn btn-primary">▶️ 계산 실행</button>
            <span id="status-text" style="margin-left: 15px; font-weight: bold;"></span>
        </div>

        <h3 style="margin-top: 30px;">출력 결과 (Stdout)</h3>
        <pre id="stdout-box" class="output-box"></pre>

        <h3>에러 및 경고 (Stderr)</h3>
        <pre id="stderr-box" class="output-box error-box"></pre>

        <button id="download-btn" class="btn btn-success">📦 결과 파일 다운로드 (.zip)</button>
    </div>

    <script src="../config.js" onerror="console.log('config.js 로드 생략')"></script>
    <script src="custom.js"></script>
</body>
</html>
